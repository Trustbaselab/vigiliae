services:
  vigiliae:
    build: .
    container_name: vigiliae
    restart: unless-stopped
    env_file: .env
    ports:
      - "8110:8110"
    volumes:
      - ./data:/app/data
      - ./agents.yaml:/app/agents.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
