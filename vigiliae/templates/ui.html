<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3,user-scalable=yes,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0F">
<title>Vigiliae</title>
<style>
:root{--bg:#0A0A0F;--sf:#131318;--sf2:#1C1C24;--bd:#26262F;--tx:#FAFAFA;--tx2:#C4C4CE;--tx3:#8A8A94;--tx4:#55555F;--ac:#FF4F9A;--ok:#10B981;--wn:#F59E0B;--dg:#EF4444;--bl:#60A5FA}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65;font-size:19px;overscroll-behavior-y:none;-webkit-text-size-adjust:100%;overflow-x:hidden;max-width:100vw}
.hd{padding:16px 18px 12px;max-width:100%;box-sizing:border-box;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:10}
.hd h1{font-size:23px;font-weight:700;display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 8px rgba(16,185,129,.6)}
.dot.off{background:var(--wn);box-shadow:0 0 8px rgba(245,158,11,.6)}
.hd .st{font-size:15px;color:var(--tx3);margin-top:3px}
.tabs{display:flex;border-bottom:1px solid var(--bd);position:sticky;top:70px;background:var(--bg);z-index:9}
.tab{flex:1;padding:15px 4px;text-align:center;font-size:18px;color:var(--tx3);border-bottom:3px solid transparent;cursor:pointer;font-weight:600}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.tab .bdg{display:inline-block;min-width:20px;height:20px;line-height:20px;padding:0 6px;border-radius:10px;background:var(--ac);color:#0A0A0F;font-size:12px;font-weight:700;margin-left:5px;vertical-align:2px}
.pane{display:none;padding:16px 18px 100px;max-width:100%;box-sizing:border-box;overflow-x:hidden}
.pane.on{display:block}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px}
.lb{font-size:14.5px;color:var(--tx4);margin-bottom:4px}
.vv{font-size:25px;font-weight:700}
.vv.ok{color:var(--ok)}.vv.wn{color:var(--wn)}.vv.dg{color:var(--dg)}.vv.ac{color:var(--ac)}
.sec{font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx4);margin:18px 0 11px}
.item{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:11px}
.item .nm{font-size:18.5px;font-weight:600;margin-bottom:4px;line-height:1.35}
.item .id{font-size:14.5px;color:var(--tx4);font-family:ui-monospace,monospace}
.rowl{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:9px;flex-wrap:wrap}
.tag{display:inline-block;font-size:14px;padding:3px 9px;border-radius:5px;background:var(--sf2);color:var(--tx3)}
.tag.ok{background:rgba(16,185,129,.15);color:var(--ok)}
.tag.dg{background:rgba(239,68,68,.15);color:var(--dg)}
.tag.wn{background:rgba(245,158,11,.15);color:var(--wn)}
.tag.ac{background:rgba(255,79,154,.15);color:var(--ac)}
button{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);padding:12px 19px;border-radius:10px;font-size:18px;cursor:pointer;font-family:inherit;font-weight:500}
button:active{opacity:.65;transform:scale(.97)}
button.pri{background:var(--ac);color:#0A0A0F;border-color:var(--ac);font-weight:700}
.out{font-size:15px;color:var(--tx4);margin-top:10px;line-height:1.6;word-break:break-all;max-height:80px;overflow:hidden}
/* 留言 */
.msgs{padding-bottom:100px;max-width:100%;overflow-x:hidden}
.msg{margin-bottom:14px;display:flex;flex-direction:column;width:100%}
.msg.you{align-items:flex-end}
.msg.dsh{align-items:flex-start}
.bub{max-width:86%;padding:14px 18px;border-radius:18px;font-size:19px;word-break:break-word;white-space:pre-wrap;line-height:1.6;display:inline-block;word-wrap:break-word;overflow-wrap:anywhere}
.msg.you .bub{background:var(--ac);color:#0A0A0F;border-bottom-right-radius:5px;align-self:flex-end}
.msg.dsh .bub{background:var(--sf2);color:var(--tx);border-bottom-left-radius:5px;align-self:flex-start}
.msg.dsh .bub b{color:#fff;font-weight:700}
.mt{font-size:14px;color:var(--tx4);margin-top:5px}
.composer{position:fixed;left:0;right:0;bottom:0;max-width:100vw;box-sizing:border-box;background:var(--sf);border-top:1px solid var(--bd);padding:11px 14px calc(11px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;z-index:20}
.composer textarea{flex:1;background:var(--sf2);border:1px solid var(--bd);border-radius:22px;padding:13px 18px;color:var(--tx);font-size:19px;font-family:inherit;resize:none;max-height:140px;line-height:1.45}
.composer textarea:focus{outline:none;border-color:rgba(255,79,154,.6)}
.composer textarea::placeholder{color:var(--tx4)}
.composer button{border-radius:22px;padding:13px 22px;flex:none;font-size:19px}
.empty{text-align:center;color:var(--tx4);font-size:18px;padding:60px 24px;line-height:1.7}
.empty .ic{font-size:44px;margin-bottom:14px;opacity:.5}
.hint{background:rgba(16,185,129,.08);border-left:3px solid var(--ok);border-radius:0 10px 10px 0;padding:15px 18px;font-size:17px;color:var(--tx2);margin-bottom:16px;line-height:1.65;word-wrap:break-word;overflow-wrap:anywhere;max-width:100%;box-sizing:border-box}
.hint b{color:var(--tx)}
.hint code{background:rgba(255,255,255,.07);padding:2px 7px;border-radius:4px;font-family:monospace;font-size:16px;color:#22D3EE}

/* prevent horizontal overflow on narrow screens */
html,body{width:100%;max-width:100vw;overflow-x:hidden !important}
body *{max-width:100vw;box-sizing:border-box}
.pane,.msgs,.hd,.tabs{width:100% !important;max-width:100vw !important;overflow-x:hidden !important}
.bub{max-width:calc(100vw - 72px) !important;word-break:break-word !important;overflow-wrap:anywhere !important}
.hint{max-width:calc(100vw - 60px) !important;overflow-wrap:anywhere !important}
.hint code{white-space:normal !important}
.composer{width:100vw !important;max-width:100vw !important;left:0 !important;right:auto !important}
</style>
</head>
<body>

<div class="hd">
  <h1><span class="dot" id="dot"></span> Vigiliae</h1>
  <div class="st" id="st">连接中…</div>
</div>

<div class="tabs">
  <div class="tab on" data-p="msg">留言<span class="bdg" id="bdg" style="display:none">0</span></div>
  <div class="tab" data-p="task">任务</div>
  <div class="tab" data-p="run">历史</div>
</div>

<div class="pane on" id="p-msg">
  <div class="hint">
    <b>能秒回的：</b><code>状态</code> <code>任务</code> <code>巡检</code> <code>备份</code> <code>数据量</code> <code>帮助</code><br>
    <b>其他问题：</b>云端 DSH 会查数据后回答，约 30-70 秒。
  </div>
  <div class="msgs" id="msgs"><div class="empty"><div class="ic">💬</div>还没有留言<br>在下面输入框发第一条</div></div>
</div>

<div class="pane" id="p-task">
  <div class="kpi" id="kpi"></div>
  <div class="sec">任务列表</div>
  <div id="tasks"></div>
</div>

<div class="pane" id="p-run">
  <div class="sec">最近执行</div>
  <div id="runs"></div>
</div>

<div class="composer" id="composer">
  <textarea id="inp" rows="1" placeholder="Message your team…"></textarea>
  <button class="pri" id="send">发送</button>
</div>

<script>
// If you mount Vigiliae under a sub-path (e.g. https://host/bot/), set API="/bot".
// When served at the root, leave it empty.
var API = "";
var lastId = 0;
var curPane = 'msg';
var sending = false;

document.querySelectorAll('.tab').forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on')});
    t.classList.add('on');
    curPane = t.dataset.p;
    document.getElementById('p-'+curPane).classList.add('on');
    document.getElementById('composer').style.display = (curPane==='msg') ? 'flex' : 'none';
    if(curPane==='task') loadTasks();
    if(curPane==='run') loadRuns();
  };
});

function loadStatus(){
  fetch(API+"/api/status").then(function(r){return r.json()}).then(function(s){
    var d = document.getElementById('dot');
    d.className = 'dot' + (s.local_online ? '' : ' off');
    document.getElementById('st').textContent =
      (s.local_online ? '本机在线 · 本机优先' : '本机离线 · 云端接管') +
      ' · ' + s.server_time.slice(11,16);
  }).catch(function(){});
}

function fmtT(s){ return s ? s.slice(11,16) : ''; }
function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function md2html(t){
  var h = esc(t);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  h = h.replace(/`([^`]+?)`/g, '<code style="background:rgba(255,255,255,.08);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:17px;color:#22D3EE">$1</code>');
  return h;
}

function renderMsgs(list, append){
  var box = document.getElementById('msgs');
  var h = '';
  list.forEach(function(m){
    var cls = m.sender === 'you' ? 'you' : 'dsh';
    var name = m.sender === 'you' ? '你' : 'DSH';
    h += '<div class="msg '+cls+'"><div class="bub">'+md2html(m.body)+'</div>'+
         '<div class="mt">'+name+' · '+fmtT(m.created_at)+'</div></div>';
  });
  if(append){
    box.insertAdjacentHTML('beforeend', h);
  } else if(list.length){
    box.innerHTML = h;
  }
  window.scrollTo(0, document.body.scrollHeight);
}

function loadMsgs(first){
  var url = API + (first ? "/api/messages" : "/api/messages?since="+lastId);
  fetch(url).then(function(r){return r.json()}).then(function(d){
    var list = d.messages || [];
    if(!list.length) return;
    var maxId = list[list.length-1].id;
    if(first){
      lastId = maxId;
      renderMsgs(list, false);
    } else {
      var news = list.filter(function(m){return m.id > lastId});
      if(news.length){
        var e = document.querySelector('#msgs .empty');
        if(e) e.remove();
        renderMsgs(news, true);
        lastId = maxId;
        // 如果最后一条是 dsh 且是刚回复的，停掉「思考中」提示
        var last = news[news.length-1];
        if(last.sender === 'dsh') clearThinking();
      }
    }
  }).catch(function(){});
}

var thinkingEl = null;
function showThinking(){
  if(thinkingEl) return;
  var box = document.getElementById('msgs');
  var e = document.querySelector('#msgs .empty');
  if(e) e.remove();
  var div = document.createElement('div');
  div.className = 'msg dsh';
  div.innerHTML = '<div class="bub" style="opacity:.7">🤔 云端 DSH 正在查数据思考…</div><div class="mt">DSH · 进行中</div>';
  box.appendChild(div);
  thinkingEl = div;
  window.scrollTo(0, document.body.scrollHeight);
}
function clearThinking(){
  if(thinkingEl && thinkingEl.parentNode){ thinkingEl.parentNode.removeChild(thinkingEl); }
  thinkingEl = null;
}

function sendMsg(){
  if(sending) return;
  var ta = document.getElementById('inp');
  var v = ta.value.trim();
  if(!v) return;

  sending = true;
  var btn = document.getElementById('send');
  btn.disabled = true;
  btn.textContent = '…';
  ta.value = '';
  ta.style.height = 'auto';

  fetch(API+"/api/messages", {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({sender:'you', body:v})
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    if(!d.ok) throw new Error(d.error || 'fail');
    var e = document.querySelector('#msgs .empty');
    if(e) e.remove();
    renderMsgs([{sender:'you', body:v, created_at:new Date().toISOString().slice(0,19).replace('T',' '), id:d.id}], true);
    lastId = d.id;
    if(d.cloud_thinking) showThinking();
    sending = false;
    btn.disabled = false;
    btn.textContent = '发送';
  }).catch(function(err){
    // 失败时把内容放回输入框，别让用户白打
    ta.value = v;
    alert('发送失败：' + err.message + '\n\n检查网络或刷新页面重试。内容已保留在输入框。');
    sending = false;
    btn.disabled = false;
    btn.textContent = '发送';
  });
}

document.getElementById('send').onclick = sendMsg;
document.getElementById('inp').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendMsg(); }
});
document.getElementById('inp').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});

function loadTasks(){
  fetch(API+"/api/tasks").then(function(r){return r.json()}).then(function(d){
    var h = '';
    (d.tasks||[]).forEach(function(t){
      h += '<div class="item">'+
        '<div class="nm">'+esc(t.name)+'</div>'+
        '<div class="id">'+esc(t.id)+'</div>'+
        '<div class="rowl">'+
          '<div>'+
            '<span class="tag">'+esc(t.kind)+'</span> '+
            (t.write_perm?'<span class="tag wn">可写</span>':'<span class="tag ok">只读</span>')+' '+
            (t.enabled?'<span class="tag ok">启用</span>':'<span class="tag">停用</span>')+
          '</div>'+
          '<div style="font-size:13.5px;color:var(--tx4)">'+esc(t.schedule||'手动')+'</div>'+
        '</div>'+
        '<div class="rowl">'+
          '<button onclick="runTask(\''+t.id+'\')">跑一次</button>'+
          '<button onclick="toggleTask(\''+t.id+'\')">'+(t.enabled?'停用':'启用')+'</button>'+
        '</div>'+
        (t.last_status ? '<div class="out">上次 '+(t.last_run_at||'').slice(5,16)+' · '+
          (t.last_status==='ok'?'<span style="color:var(--ok)">ok</span>':'<span style="color:var(--dg)">'+esc(t.last_status)+'</span>')+'</div>' : '')+
      '</div>';
    });
    document.getElementById('tasks').innerHTML = h || '<div class="empty">没有任务</div>';
  }).catch(function(){});
}

function runTask(id){
  if(!confirm('现在跑一次？')) return;
  fetch(API+"/api/tasks/"+id+"/run",{method:'POST'}).then(function(r){return r.json()}).then(function(d){
    alert('已执行：' + (d.result ? d.result.status : '?'));
    loadTasks();
  }).catch(function(){alert('失败')});
}

function toggleTask(id){
  fetch(API+"/api/tasks/"+id+"/toggle",{method:'POST'}).then(function(r){return r.json()}).then(loadTasks);
}

function loadRuns(){
  fetch(API+"/api/runs?limit=20").then(function(r){return r.json()}).then(function(d){
    var h = '';
    (d.runs||[]).forEach(function(r){
      h += '<div class="item">'+
        '<div class="rowl" style="margin-top:0">'+
          '<div class="nm" style="font-size:15.5px">#'+r.run_id+' '+esc(r.task_id)+'</div>'+
          (r.status==='ok'?'<span class="tag ok">ok</span>':'<span class="tag dg">'+esc(r.status)+'</span>')+
        '</div>'+
        '<div style="font-size:13.5px;color:var(--tx4);margin-top:4px">'+(r.started_at||'').slice(5,16)+' · '+(r.duration_ms||0)+'ms</div>'+
        '<div class="out">'+esc((r.stdout||r.stderr||'').slice(0,150))+'</div>'+
      '</div>';
    });
    document.getElementById('runs').innerHTML = h || '<div class="empty">没有执行记录</div>';
  }).catch(function(){});
}

function loadKpi(){
  fetch(API+"/api/status").then(function(r){return r.json()}).then(function(s){
    document.getElementById('kpi').innerHTML =
      box('角色', s.local_online?'本机为主':'云端接管', s.local_online?'ok':'wn')+
      box('任务', s.tasks.total+' / 启用 '+s.tasks.enabled, '')+
      box('执行', s.runs.total+' 次', '')+
      box('失败', s.runs.failed, s.runs.failed>0?'dg':'ok');
  }).catch(function(){});
}
function box(l,v,c){ return '<div class="box"><div class="lb">'+l+'</div><div class="vv '+c+'">'+v+'</div></div>'; }

function loadUnread(){
  fetch(API+"/api/messages/unread_count").then(function(r){return r.json()}).then(function(d){
    var b = document.getElementById('bdg');
    if(d.unread > 0){ b.textContent = d.unread; b.style.display = 'inline-block'; }
    else { b.style.display = 'none'; }
  }).catch(function(){});
}

loadStatus(); loadMsgs(true); loadUnread();
setInterval(loadStatus, 15000);
setInterval(function(){ if(curPane==='msg') loadMsgs(false); }, 4000);
setInterval(loadUnread, 20000);
</script>
</body>
</html>
