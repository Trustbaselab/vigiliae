name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest

      - name: Compile check (syntax gate)
        run: |
          python -m compileall -q vigiliae/
          echo "✓ all modules compile"

      - name: Skill self-tests
        run: |
          set -e
          for skill in memory verify patrol collect report; do
            echo "── $skill ──"
            python vigiliae/$skill.py --test
          done
          echo "✓ all 5 skill self-tests passed"

      - name: Package import check
        run: |
          python -c "import vigiliae; print('package importable')"
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (non-blocking informational)
        run: ruff check vigiliae/ --output-format=github || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for accidentally committed secrets
        run: |
          set -e
          echo "Scanning tracked files for live credentials…"
          # Real DeepSeek keys are sk- + 32 hex. The test fixture uses sk-EXAMPLE0000…
          if git grep -nE 'sk-[a-f0-9]{32}' -- '*.py' '*.md' '*.yaml' '*.yml' '*.toml' '*.sh' '*.env*'; then
            echo "::error::Found what looks like a live DeepSeek API key"
            exit 1
          fi
          if git grep -nE 'AKID[A-Za-z0-9]{32}' -- '*.py' '*.md' '*.yaml' '*.yml' '*.toml' '*.sh'; then
            echo "::error::Found what looks like a Tencent Cloud secret id"
            exit 1
          fi
          if git grep -nE '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' -- '*.py' '*.md' '*.yaml' '*.yml'; then
            echo "::error::Found what looks like a Telegram bot token"
            exit 1
          fi
          echo "✓ no live credentials in tracked files"
